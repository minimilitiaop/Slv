<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#06040d"><title>Selov asx — Create account</title><link rel="icon" href="/img/favicon.svg" type="image/svg+xml"><style>
:root{--bg:#06040d;--line:rgba(176,140,255,.24);--p:#7c3aed;--p2:#a855f7;--p3:#c4b5fd;--text:#f2efff;--mute:#a8a2c4;--bad:#fb7185;--glass:rgba(255,255,255,.045)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 80% 10%,rgba(109,40,217,.28),transparent 55%),radial-gradient(ellipse at 5% 80%,rgba(76,29,149,.28),transparent 50%),var(--bg)}.card{width:min(460px,100%);padding:30px;border:1px solid var(--line);border-radius:22px;background:var(--glass);backdrop-filter:blur(16px);box-shadow:0 24px 60px #0008}.brand{font-size:20px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.brand small{color:var(--p2);margin-left:6px}.eyebrow{margin-top:20px;color:var(--p2);font-weight:700;letter-spacing:.2em;text-transform:uppercase;font-size:12px}h1{font-size:30px;margin:5px 0}.muted{color:var(--mute);font-size:14px}.field{display:block;margin-top:16px}.field span{display:block;margin-bottom:7px;color:var(--p3);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}.field input{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:13px;background:#05030ecc;color:var(--text);font:inherit;outline:none}.field input:focus{border-color:var(--p2);box-shadow:0 0 0 3px #8b5cf633}.submit{width:100%;margin-top:20px;padding:14px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--p),#c026d3);color:white;font-weight:800;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}.submit:disabled{opacity:.55}.switch{margin-top:18px;font-size:14px;color:var(--mute)}a{color:#c4b5fd}#err{min-height:22px;color:var(--bad);font-size:13px;margin-top:10px}button, input{font:inherit}
</style></head>
<body><div class="bg"></div><main class="card"><a class="brand" href="/">Selov<small>asx</small></a><div class="eyebrow">Join Selov asx</div><h1>Create your account</h1><p class="muted">Your unique ID and balance will be ready after registration.</p>
<form id="authForm"><label class="field"><span>Choose a username</span><input id="username" type="text" autocomplete="username" minlength="3" maxlength="20" pattern="[A-Za-z0-9_.]+" required></label><label class="field"><span>PIN (4–8 digits)</span><input id="pin" type="password" inputmode="numeric" minlength="4" maxlength="8" autocomplete="new-password" pattern="[0-9]{4,8}" required></label><div id="err" role="alert"></div><button class="submit" id="submit" type="submit">Create account</button></form><p class="switch">Already registered? <a data-switch href="/login.html">Log in</a> · <a href="/">Back to storefront</a></p></main>
<script nonce="{{NONCE}}">(function(){var wanted=new URLSearchParams(location.search).get('next')||'/';var nextPath=wanted.charAt(0)==='/'&&wanted.slice(0,2)!=='//'?wanted:'/';var switchLink=document.querySelector('[data-switch]');if(switchLink&&nextPath!=='/')switchLink.href+='?next='+encodeURIComponent(nextPath);var f=document.getElementById('authForm'),b=document.getElementById('submit'),err=document.getElementById('err');f.addEventListener('submit',function(e){e.preventDefault();b.disabled=true;err.textContent='';fetch('/api/register',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-Requested-With':'selov'},body:JSON.stringify({username:document.getElementById('username').value.trim(),pin:document.getElementById('pin').value})}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'Could not create account');return j;});}).then(function(){location.replace(nextPath);}).catch(function(x){err.textContent=x.message;b.disabled=false;});});})();</script></body></html>
