<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#06040d">
<title>Selov asx — Live chat</title>
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#06040d;--line:rgba(176,140,255,.24);--p:#7c3aed;--p2:#a855f7;--text:#f2efff;--mute:#a8a2c4;--bad:#fb7185;--glass:rgba(255,255,255,.045)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 80% 10%,rgba(109,40,217,.28),transparent 55%),radial-gradient(ellipse at 5% 80%,rgba(76,29,149,.28),transparent 50%),var(--bg)}header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100vw - 860px)/2));border-bottom:1px solid var(--line);background:#06040dcc;backdrop-filter:blur(12px)}a{color:#c4b5fd;text-decoration:none}.brand{font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--text)}.brand small{color:var(--p2);margin-left:5px}.wrap{width:min(860px,100%);margin:28px auto;padding:0 16px;flex:1;display:flex;flex-direction:column}.panel{min-height:68vh;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:22px;background:var(--glass);backdrop-filter:blur(16px);box-shadow:0 24px 60px #0008;overflow:hidden}.heading{padding:20px 22px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,#7c3aed44,transparent)}.heading h1{font-size:20px;margin:0}.heading p{margin:4px 0 0;color:var(--mute);font-size:13px}.messages{flex:1;min-height:45vh;max-height:65vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:10px}.msg{max-width:min(82%,560px);padding:11px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user{align-self:flex-end;background:linear-gradient(135deg,#6d28d9,#a855f7);border-bottom-right-radius:4px}.msg.agent{align-self:flex-start;background:#ffffff16;border-bottom-left-radius:4px}.msg small{display:block;opacity:.65;font-size:10px;margin-top:4px}.empty{margin:auto;color:var(--mute);text-align:center}.composer{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line)}input{min-width:0;flex:1;padding:13px 15px;border:1px solid var(--line);border-radius:13px;background:#05030ecc;color:var(--text);font:inherit;outline:none}input:focus{border-color:var(--p2)}button{padding:12px 20px;border:0;border-radius:13px;background:linear-gradient(135deg,var(--p),#c026d3);color:#fff;font-weight:800;cursor:pointer}button:disabled{opacity:.55;cursor:wait}#status{min-height:22px;padding:0 18px;color:var(--bad);font-size:13px}footer{text-align:center;color:var(--mute);font-size:12px;padding:4px 16px 24px}
</style>
</head>
<body>
<div class="bg"></div>
<header><a class="brand" href="/">Selov<small>asx</small></a><a href="/">Back to storefront</a></header>
<main class="wrap"><section class="panel" aria-label="Live support chat"><div class="heading"><h1>Chat with the Selov asx agent</h1><p>Messages are private to your account. We’ll reply here.</p></div><div id="messages" class="messages" aria-live="polite"><div class="empty" id="empty">Loading your conversation…</div></div><div id="status" role="alert"></div><form class="composer" id="form"><input id="text" maxlength="1000" autocomplete="off" placeholder="Type a message…" aria-label="Message"><button id="send" type="submit">Send</button></form></section></main>
<footer>Need an account? <a href="/login.html?next=%2Fchat.html">Log in</a> or <a href="/register.html?next=%2Fchat.html">create one</a>.</footer>
<script nonce="{{NONCE}}">
(function(){
  var box=document.getElementById('messages'),empty=document.getElementById('empty'),form=document.getElementById('form'),input=document.getElementById('text'),send=document.getElementById('send'),status=document.getElementById('status');
  function time(ts){return new Date(ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});}
  function append(m){if(box.querySelector('[data-id="'+String(m.id)+'"]'))return;if(empty)empty.remove();var el=document.createElement('div');el.className='msg '+(m.from==='user'?'user':'agent');el.dataset.id=String(m.id);el.appendChild(document.createTextNode(m.text));var small=document.createElement('small');small.textContent=time(m.ts);el.appendChild(small);box.appendChild(el);box.scrollTop=box.scrollHeight;}
  function redirect(){location.replace('/login.html?next=%2Fchat.html');}
  fetch('/api/chat',{credentials:'same-origin'}).then(function(r){if(r.status===401){redirect();throw new Error('Please log in to chat.');}return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'Could not load chat');return j;});}).then(function(d){if(empty)empty.remove();if(!d.messages.length){empty=document.createElement('div');empty.className='empty';empty.id='empty';empty.textContent='Send a message to start the conversation.';box.appendChild(empty);}d.messages.forEach(append);var es=new EventSource('/api/events');es.addEventListener('chat',function(e){append(JSON.parse(e.data));});}).catch(function(e){if(e.message!=='Please log in to chat.')status.textContent=e.message;});
  form.addEventListener('submit',function(e){e.preventDefault();var text=input.value.trim();if(!text)return;send.disabled=true;status.textContent='';fetch('/api/chat',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-Requested-With':'selov'},body:JSON.stringify({text:text})}).then(function(r){return r.json().then(function(j){if(r.status===401){redirect();throw new Error('Please log in to chat.');}if(!r.ok)throw new Error(j.error||'Could not send message');return j;});}).then(function(d){input.value='';append(d.message);}).catch(function(e){if(e.message!=='Please log in to chat.')status.textContent=e.message;}).then(function(){send.disabled=false;input.focus();});});
})();
</script>
</body>
</html>
